put:
  tags:
    - posts
  summary: mark post as official
  description: This operation marks a post as official
  parameters:
    - in: path
      name: pid
      schema:
        type: string
      required: true
      description: a valid post id
      example: 2
  requestBody:
    description: Mark post as official request body
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            official:
              type: boolean
              description: Flag to mark the post as official
              example: true
  responses:
    '200':
      description: Post successfully marked as official.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                $ref: ../../../components/schemas/Status.yaml#/Status
              response:
                type: object
                properties:
                  official:
                    type: boolean
                    description: Indicates if the post is marked as official
                    example: true
    '404':
      description: Post not found.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                $ref: ../../../components/schemas/Status.yaml#/Status
              error:
                type: string
                description: Error message
                example: Post not found
delete:
  tags:
    - posts
  summary: unmarked post as official
  description: This operation unmarks a post as official.
  parameters:
    - in: path
      name: pid
      schema:
        type: string
      required: true
      description: a valid post id
      example: 2
  responses:
    '200':
      description: Post successfully unmarked as official
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                $ref: ../../../components/schemas/Status.yaml#/Status
              response:
                type: object
                properties: {}